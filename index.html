<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokédex API</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="container">
    <img src="https://upload.wikimedia.org/wikipedia/commons/9/98/International_Pok%C3%A9mon_logo.svg" alt="Pokemon Logo" class="logo">

    <form action="" class="search">
      <input type="search" class="search-input" placeholder="Nome ou nº do Pokémon (ex: 25 ou pikachu)">
      <button class="search-button">Buscar</button>
    </form>

    <section class="pokemon"></section>
    
    <span class="error">Pokémon não encontrado! Tente novamente.</span>
  </main>

  <script src="index.js"></script>
</body>
</html>
